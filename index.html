<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Outils du Club</title>
<style>
  :root {
    --club-white: #FFFFFF;
    --club-red: #DB1E33;
  }
  * {
    box-sizing: border-box;
  }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f7f7f7;
    color: #222;
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .page {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    padding: clamp(16px, 3vw, 40px);
    flex: 1;
  }
  .header {
    background: var(--club-red);
    color: var(--club-white);
    padding: clamp(20px, 3vw, 32px);
    border-radius: 10px;
    text-align: center;
    margin-bottom: clamp(20px, 3vw, 32px);
  }
  .header h1 {
    margin: 0;
    font-size: clamp(22px, 3vw, 30px);
    letter-spacing: 0.5px;
  }
  .header p {
    margin: 8px 0 0;
    font-size: clamp(13px, 1.4vw, 15px);
    opacity: 0.9;
  }
  .tools {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .tool-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    background: var(--club-white);
    border: 2px solid var(--club-red);
    border-radius: 10px;
    padding: 18px 22px;
    text-decoration: none;
    color: #222;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .tool-card:hover {
    background: #fdf1f2;
    transform: translateY(-1px);
  }
  .tool-card .icon {
    font-size: 26px;
    flex-shrink: 0;
  }
  .tool-card .content {
    flex: 1;
  }
  .tool-card .name {
    font-weight: 700;
    font-size: 17px;
    color: var(--club-red);
  }
  .tool-card .desc {
    font-size: 13px;
    color: #666;
    margin-top: 2px;
  }
  .tool-card .arrow {
    font-size: 20px;
    color: var(--club-red);
    flex-shrink: 0;
  }
  .empty-note {
    margin-top: 20px;
    font-size: 13px;
    color: #999;
    font-style: italic;
    text-align: center;
  }
</style>
</head>
<body>

<div class="page">

  <div class="header">
    <h1>🏉 Outils du Club</h1>
    <p>Espace regroupant les outils pratiques pour l'équipe</p>
  </div>

  <div class="tools">

    <a class="tool-card" href="planning.html">
      <div class="icon">📅</div>
      <div class="content">
        <div class="name">Planning des entraînements Septembre</div>
        <div class="desc">Répartition des coachs — Septembre 2026</div>
      </div>
      <div class="arrow">→</div>
    </a>

    <a class="tool-card" href="planning_entrainements_octobre_2026.html">
      <div class="icon">📅</div>
      <div class="content">
        <div class="name">Planning des entraînements Octobre</div>
        <div class="desc">Répartition des coachs — Octobre 2026</div>
      </div>
      <div class="arrow">→</div>
    </a>

    <a class="tool-card" href="composition-rugby.html">
      <div class="icon">🏉</div>
      <div class="content">
        <div class="name">Composition équipe</div>
        <div class="desc">Classement activités</div>
      </div>
      <div class="arrow">→</div>
    </a>

    <!--
      Pour ajouter un nouvel outil :
      1. Uploade son fichier .html dans le repository (ex: convocations.html)
      2. Copie-colle un bloc <a class="tool-card">...</a> ci-dessus
      3. Change href, icon, name et desc pour ton nouvel outil

      Exemple :
      <a class="tool-card" href="convocations.html">
        <div class="icon">✉️</div>
        <div class="content">
          <div class="name">Convocations</div>
          <div class="desc">Générateur de convocations match</div>
        </div>
        <div class="arrow">→</div>
      </a>
    -->

  </div>

</div>

</body>
</html>
